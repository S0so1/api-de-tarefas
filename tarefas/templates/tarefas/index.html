    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>

    <!-- ================= ETAPA G: ESTILO (CSS) ================= -->
    <style>
        /* Variáveis de cor: mude aqui e a página inteira acompanha */
        :root {
        --fundo: #f4f5f7;
        --cartao: #ffffff;
        --texto: #1f2328;
        --suave: #6b7280;
        --borda: #e2e4e8;
        --primaria: #4f46e5;
        --primaria-escura: #4338ca;
        --perigo: #dc2626;
        --ok: #16a34a;
        --alta-fundo: #fee2e2;  --alta-texto: #b91c1c;
        --media-fundo: #fef3c7; --media-texto: #a16207;
        --baixa-fundo: #dcfce7; --baixa-texto: #15803d;
        }

        /* Tema escuro automático, se o sistema estiver no modo escuro */
        @media (prefers-color-scheme: dark) {
        :root {
            --fundo: #0f1115;
            --cartao: #181b21;
            --texto: #e6e8eb;
            --suave: #9aa1ab;
            --borda: #2a2f37;
            --alta-fundo: #3b1214;  --alta-texto: #fca5a5;
            --media-fundo: #3a2e0b; --media-texto: #fcd34d;
            --baixa-fundo: #0f2e1a; --baixa-texto: #86efac;
        }
        }

        * { box-sizing: border-box; }

        body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--fundo);
        color: var(--texto);
        }

        .container { max-width: 720px; margin: 0 auto; padding: 32px 16px; }

        h1 { font-size: 1.7rem; margin: 0; }
        h2 { font-size: 1.05rem; margin: 0 0 14px; }

        /* Cartão: caixa branca com borda arredondada */
        .cartao {
        background: var(--cartao);
        border: 1px solid var(--borda);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
        }

        /* Campos de formulário */
        input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--borda);
        border-radius: 8px;
        background: var(--fundo);
        color: var(--texto);
        font: inherit;
        }
        input:focus, select:focus, textarea:focus {
        outline: 2px solid var(--primaria);
        border-color: transparent;
        }
        textarea { resize: vertical; min-height: 64px; }
        label { display: block; font-size: .85rem; color: var(--suave); margin-bottom: 4px; }
        .campo { margin-bottom: 12px; }

        /* Grade de duas colunas (vira uma coluna no celular) */
        .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 560px) { .duas-colunas { grid-template-columns: 1fr; } }

        /* Botões */
        button {
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--primaria);
        color: #fff;
        }
        button:hover { background: var(--primaria-escura); }
        .botao-secundario { background: transparent; color: var(--suave); border: 1px solid var(--borda); }
        .botao-secundario:hover { background: var(--fundo); color: var(--texto); }
        .botao-excluir { background: transparent; color: var(--perigo); padding: 6px 10px; }
        .botao-excluir:hover { background: var(--alta-fundo); }

        /* Tela de login centralizada */
        #tela-login { max-width: 380px; margin: 60px auto; }
        #tela-login h1 { margin-bottom: 4px; }
        #tela-login button { width: 100%; }

        /* Cabeçalho da tela principal */
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .topo-direita { display: flex; align-items: center; gap: 12px; }

        .texto-suave { color: var(--suave); font-size: .9rem; margin: 0 0 12px; }
        #erro { color: var(--perigo); font-weight: 600; min-height: 1.2em; margin: 8px 0; }

        /* Lista de tarefas */
        #lista { list-style: none; padding: 0; margin: 0; }
        #lista li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--borda);
        }
        #lista li:last-child { border-bottom: none; }
        #lista li.vazio { justify-content: center; color: var(--suave); }
        #lista input[type="checkbox"] {
        width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0;
        accent-color: var(--ok); cursor: pointer;
        }
        .conteudo { flex: 1; min-width: 0; }
        .titulo { font-weight: 600; word-break: break-word; }
        .descricao { color: var(--suave); font-size: .9rem; margin-top: 4px; white-space: pre-wrap; }
        .detalhes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: .8rem; color: var(--suave); }

        /* Tarefa concluída: título riscado e apagado */
        li.concluida .titulo { text-decoration: line-through; color: var(--suave); }

        /* Etiqueta colorida de prioridade */
        .etiqueta { padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: .75rem; }
        .etiqueta.ALTA  { background: var(--alta-fundo);  color: var(--alta-texto); }
        .etiqueta.MEDIA { background: var(--media-fundo); color: var(--media-texto); }
        .etiqueta.BAIXA { background: var(--baixa-fundo); color: var(--baixa-texto); }

        .atrasada { color: var(--perigo); font-weight: 600; }
    </style>
    </head>
    <body>
    <div class="container">

        <!-- ================= TELA DE LOGIN ================= -->
        <section id="tela-login" class="cartao">
        <h1>Minhas Tarefas</h1>
        <p class="texto-suave">Entre com seu usuário para ver suas tarefas.</p>
        <form id="form-login">
            <div class="campo">
            <label for="username">Usuário</label>
            <input id="username" autocomplete="username" required>
            </div>
            <div class="campo">
            <label for="password">Senha</label>
            <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        </section>

        <!-- ================= TELA PRINCIPAL (começa escondida) ================= -->
        <section id="tela-app" hidden>
        <div class="topo">
            <h1>Minhas Tarefas</h1>
            <div class="topo-direita">
            <span class="texto-suave" id="saudacao" style="margin: 0;"></span>
            <button class="botao-secundario" id="botao-sair">Sair</button>
            </div>
        </div>

        <!-- Formulário de nova tarefa -->
        <div class="cartao">
            <h2>Nova tarefa</h2>
            <form id="form-tarefa">
            <div class="campo">
                <label for="titulo">Título *</label>
                <input id="titulo" maxlength="150" required>
            </div>
            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao"></textarea>
            </div>
            <div class="duas-colunas">
                <div class="campo">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade">
                    <option value="BAIXA">Baixa</option>
                    <option value="MEDIA" selected>Média</option>
                    <option value="ALTA">Alta</option>
                </select>
                </div>
                <div class="campo">
                <label for="data_limite">Data limite</label>
                <input id="data_limite" type="date">
                </div>
            </div>
            <button type="submit">Adicionar</button>
            </form>
        </div>

        <!-- Filtros: viram ?concluida=...&prioridade=... na URL -->
        <div class="cartao">
            <div class="duas-colunas">
            <div>
                <label for="filtro-concluida">Situação</label>
                <select id="filtro-concluida">
                <option value="">Todas</option>
                <option value="false">Pendentes</option>
                <option value="true">Concluídas</option>
                </select>
            </div>
            <div>
                <label for="filtro-prioridade">Prioridade</label>
                <select id="filtro-prioridade">
                <option value="">Todas</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
                </select>
            </div>
            </div>
        </div>

        <!-- Lista de tarefas -->
        <div class="cartao">
            <p class="texto-suave" id="resumo"></p>
            <ul id="lista"></ul>
        </div>
        </section>

        <!-- Um único lugar para mensagens de erro -->
        <p id="erro"></p>
    </div>

    <script>
        const API = '/api';
        let token = null;
        const NOMES_PRIORIDADE = { BAIXA: 'Baixa', MEDIA: 'Média', ALTA: 'Alta' };

        // ================= FUNÇÃO CENTRAL DE REQUISIÇÕES =================
        // Toda chamada à API passa por aqui: coloca o token no cabeçalho,
        // converte o corpo para JSON e transforma respostas de erro em exceções.
        async function api(caminho, metodo = 'GET', corpo = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
            headers['Authorization'] = 'Token ' + token;
        }

        const resposta = await fetch(API + caminho, {
            method: metodo,
            headers: headers,
            body: corpo ? JSON.stringify(corpo) : null,
        });

        const texto = await resposta.text();

        if (!resposta.ok) {
            throw new Error(mensagemDeErro(resposta.status, texto));
        }

        // DELETE responde 204 sem corpo: aí não há JSON para ler
        return texto ? JSON.parse(texto) : null;
        }

        // Transforma a resposta de erro em uma frase legível
        function mensagemDeErro(status, texto) {
        if (status >= 500) {
            // Página de erro HTML do Django: o DOMParser lê o HTML e converte &quot; em "
            const pagina = new DOMParser().parseFromString(texto, 'text/html');
            const detalhe = pagina.querySelector('.exception_value');
            return 'Erro ' + status + ' no servidor: ' + pagina.title +
            (detalhe ? ' → ' + detalhe.textContent : '');
        }
        try {
            const dados = JSON.parse(texto);
            return 'Erro ' + status + ': ' + (dados.detail || JSON.stringify(dados));
        } catch {
            return 'Erro ' + status;
        }
        }

        function mostrarErro(mensagem) {
        document.getElementById('erro').textContent = mensagem;
        }

        // ================= LOGIN (POST /api/login/) =================
        document.getElementById('form-login').addEventListener('submit', async (evento) => {
        evento.preventDefault();   // impede o navegador de recarregar a página
        mostrarErro('');
        const usuario = document.getElementById('username').value;

        try {
            const dados = await api('/login/', 'POST', {
            username: usuario,
            password: document.getElementById('password').value,
            });
            token = dados.token;
            document.getElementById('form-login').reset();
            document.getElementById('tela-login').hidden = true;
            document.getElementById('tela-app').hidden = false;
            document.getElementById('saudacao').textContent = 'Olá, ' + usuario + '!';
            carregarTarefas();
        } catch (e) {
            mostrarErro('Usuário ou senha inválidos.');
        }
        });

        // ================= SAIR =================
        // Esquece o token e volta para a tela de login
        document.getElementById('botao-sair').addEventListener('click', () => {
        token = null;
        mostrarErro('');
        document.getElementById('lista').innerHTML = '';
        document.getElementById('tela-app').hidden = true;
        document.getElementById('tela-login').hidden = false;
        });

        // ================= LISTAR (GET /api/tarefas/ + filtros) =================
        async function carregarTarefas() {
        try {
            // Monta ?concluida=...&prioridade=... a partir dos filtros escolhidos
            const parametros = new URLSearchParams();
            const concluida = document.getElementById('filtro-concluida').value;
            const prioridade = document.getElementById('filtro-prioridade').value;
            if (concluida) parametros.set('concluida', concluida);
            if (prioridade) parametros.set('prioridade', prioridade);

            const query = parametros.toString() ? '?' + parametros.toString() : '';
            const tarefas = await api('/tarefas/' + query);

            // Resumo no topo da lista
            const pendentes = tarefas.filter((t) => !t.concluida).length;
            document.getElementById('resumo').textContent =
            tarefas.length + ' tarefa(s) · ' + pendentes + ' pendente(s) · ' +
            (tarefas.length - pendentes) + ' concluída(s)';

            const lista = document.getElementById('lista');
            lista.innerHTML = '';   // limpa antes de desenhar de novo

            if (tarefas.length === 0) {
            lista.innerHTML = '<li class="vazio">Nenhuma tarefa encontrada.</li>';
            return;
            }

            const hoje = new Date().toISOString().slice(0, 10);   // "AAAA-MM-DD"

            for (const tarefa of tarefas) {
            const item = document.createElement('li');
            if (tarefa.concluida) {
                item.classList.add('concluida');   // o CSS risca o título
            }

            // Caixinha para concluir
            const caixa = document.createElement('input');
            caixa.type = 'checkbox';
            caixa.checked = tarefa.concluida;
            caixa.title = 'Marcar como concluída';
            caixa.addEventListener('change', () => concluir(tarefa.id, caixa.checked));

            // Bloco de conteúdo: título, descrição e detalhes
            const conteudo = document.createElement('div');
            conteudo.className = 'conteudo';

            // textContent evita executar HTML do título: proteção contra XSS
            const titulo = document.createElement('div');
            titulo.className = 'titulo';
            titulo.textContent = tarefa.titulo;
            conteudo.appendChild(titulo);

            if (tarefa.descricao) {
                const descricao = document.createElement('div');
                descricao.className = 'descricao';
                descricao.textContent = tarefa.descricao;
                conteudo.appendChild(descricao);
            }

            const detalhes = document.createElement('div');
            detalhes.className = 'detalhes';

            // Etiqueta colorida: a classe ALTA/MEDIA/BAIXA escolhe a cor no CSS
            const etiqueta = document.createElement('span');
            etiqueta.className = 'etiqueta ' + tarefa.prioridade;
            etiqueta.textContent = NOMES_PRIORIDADE[tarefa.prioridade] || tarefa.prioridade;
            detalhes.appendChild(etiqueta);

            // Data limite no formato DD/MM/AAAA, em vermelho se estiver atrasada
            if (tarefa.data_limite) {
                const prazo = document.createElement('span');
                const [ano, mes, dia] = tarefa.data_limite.split('-');
                const atrasada = !tarefa.concluida && tarefa.data_limite < hoje;
                prazo.textContent = (atrasada ? 'Atrasada · ' : 'Até ') + dia + '/' + mes + '/' + ano;
                if (atrasada) {
                prazo.className = 'atrasada';
                }
                detalhes.appendChild(prazo);
            }
            conteudo.appendChild(detalhes);

            // Botão excluir
            const botao = document.createElement('button');
            botao.className = 'botao-excluir';
            botao.textContent = 'Excluir';
            botao.addEventListener('click', () => excluir(tarefa.id, tarefa.titulo));

            item.append(caixa, conteudo, botao);
            lista.appendChild(item);
            }
        } catch (e) {
            mostrarErro(e.message);
        }
        }

        // ================= CRIAR (POST /api/tarefas/) =================
        document.getElementById('form-tarefa').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        mostrarErro('');
        try {
            // Repare: não enviamos "usuario". O servidor define o dono pelo token.
            await api('/tarefas/', 'POST', {
            titulo: document.getElementById('titulo').value,
            descricao: document.getElementById('descricao').value,
            prioridade: document.getElementById('prioridade').value,
            data_limite: document.getElementById('data_limite').value || null,
            });
            document.getElementById('form-tarefa').reset();
            carregarTarefas();
        } catch (e) {
            mostrarErro(e.message);
        }
        });

        // ================= CONCLUIR (PATCH /api/tarefas/<id>/) =================
        async function concluir(id, concluida) {
        mostrarErro('');
        try {
            await api('/tarefas/' + id + '/', 'PATCH', { concluida: concluida });
            carregarTarefas();
        } catch (e) {
            mostrarErro(e.message);
        }
        }

        // ================= EXCLUIR (DELETE /api/tarefas/<id>/) =================
        async function excluir(id, titulo) {
        if (!confirm('Excluir a tarefa "' + titulo + '"?')) {
            return;   // a pessoa clicou em Cancelar
        }
        mostrarErro('');
        try {
            await api('/tarefas/' + id + '/', 'DELETE');
            carregarTarefas();
        } catch (e) {
            mostrarErro(e.message);
        }
        }

        // ================= FILTROS =================
        // Recarrega a lista sempre que um filtro mudar
        document.getElementById('filtro-concluida').addEventListener('change', carregarTarefas);
        document.getElementById('filtro-prioridade').addEventListener('change', carregarTarefas);
    </script>
    </body>
    </html>
